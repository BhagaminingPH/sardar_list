<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>mining sardar</title>

  <!-- FontAwesome & Google Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous" />

  

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
    }

    /* Navbar styling */
    .navbar {
      background-color: #ffffff;
      border-bottom: 1px solid #e2e8f0;
    }

    .navbar-brand img {
      height: 48px;
      object-fit: contain;
    }

    /* Main container spacing */
    .main-container {
      max-width: 850px;
      /* margin-top: 2rem; */
      margin-bottom: 3rem;
    }

    /* Subject Header Banner */
    .subject-banner {
      background: linear-gradient(135deg, #dcfce7 0%, #bbf7d0 100%);
      border: 1px solid #86efac;
      border-radius: 12px;
      padding: 1.25rem;
      color: #14532d;
    }

    /* Table card design */
    .table-card {
      background: #ffffff;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      overflow: hidden;
    }

    .table {
      margin-bottom: 0;
      vertical-align: middle;
    }

    .table thead th {
      background-color: #f1f5f9;
      color: #64748b;
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 1px solid #e2e8f0;
      padding: 1rem 1.25rem;
    }

    .table tbody tr {
      transition: background-color 0.15s ease-in-out;
    }

    .table tbody tr:hover {
      background-color: #f0fdf4;
    }

    .table td {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid #f1f5f9;
      color: #334155;
      font-size: 1rem;
    }

    /* Action button */
    .btn-view {
      background-color: #e0e7ff;
      color: #4338ca;
      border: none;
      border-radius: 8px;
      padding: 0.4rem 0.85rem;
      font-size: 0.875rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s ease;
    }

    .btn-view:hover {
      background-color: #4338ca;
      color: #ffffff;
    }

    .num-col {
      width: 70px;
      font-weight: 600;
      color: #94a3b8;
    }
  </style>
</head>

<body>
  <div class="sticky-top">

    <div class="container-fluid ">
        <a class="navbar-brand fw-bold" href="/"><img src="img/mylogo.webp" style="height: 60px;" alt="ph-mining" srcset=""></a>
    </div>

</div>

<!-- Main Content Container -->
<div class="container main-container">

    <!-- Subject Heading -->
    <div class="subject-banner mb-4 text-center shadow-sm">
        <h1 class="h3 fw-bold mb-0">Question Collection MINING SIRDAR</h1>
    </div>

    <!-- PDF Table -->
    <div class="table-card">
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead>
                    <tr>
                        <th scope="col" class="num-col">No.</th>
                        <th scope="col">Name</th>
                        <th scope="col" class="text-end">View</th>
                    </tr>
                </thead>
                <tbody>
                    

                    <tr style="cursor: pointer;" href="javascript:void(0)" data-url="https://bhagaminingph.github.io/WCL_2017/"  class="protected-card" >
                        
                            
                            <td class="num-col">1.</td>
                            <td class="fw-medium">WCL 2017 MINING SIRDAR </td>
                            <td class="text-end">
                                <span class="btn-view"><i class="fa-regular fa-eye"></i> View</span>
                            </td>
                        
                    </tr>


                    <!-- Password Popup HTML -->
                    <div class="modal-overlay" id="passwordModal">
                        <div class="modal-box">
                            <h3>Enter Password 🔐</h3>
                            <input type="password" id="cardPassword" placeholder="Password" />
                            <div class="error-msg" id="errorMsg">
                                Incorrect password! Please try again. or Contact Prakash from the
                                Mining branch .
                            </div>
                            <div class="modal-buttons">
                                <button class="modal-btn btn-submit" id="submitPassBtn">OK</button>
                                <button class="modal-btn btn-cancel" id="cancelPassBtn">
                                    cancel
                                </button>
                            </div>
                        </div>
                    </div>





                </tbody>
            </table>
        </div>
    </div>
      
</div>



  <!-- Bootstrap Bundle with Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
    crossorigin="anonymous"></script>

  <script type="module" src="comman.main.js"></script>
</body>

</html>
